# Config do Supabase CLI. Sem Docker nesta máquina: usamos só `link` + `db push`
# contra o projeto na nuvem (não `supabase start`).
# Preencha project_id com o ref do seu projeto (Dashboard → Settings → General).

project_id = "srqgkvajsbpagpdrxksq"

[db]

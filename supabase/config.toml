# Config do Supabase CLI + integração GitHub.
# As migrations em supabase/migrations/ sobem no push para a branch de produção.

project_id = "srqgkvajsbpagpdrxksq"

[db]
# versão do Postgres do projeto na nuvem (Dashboard → Settings → Infrastructure)
major_version = 15

# Auth (site_url / redirect URLs) fica gerenciado pelo Dashboard por enquanto
# — evita sobrescrever a config de produção com valores de localhost.
# Quando o app estiver no Cloudflare Pages, adicionamos um [auth] aqui.

# enviar-wapi só é chamada de dentro do Postgres (trigger/pg_cron), nunca do browser
# — autenticação é por segredo compartilhado (header x-webhook-secret), não JWT de usuário.
[functions.enviar-wapi]
verify_jwt = false

# agente-midia é chamada só pelo n8n (agente de WhatsApp) com a chave secreta do projeto (sb_secret_, que não é JWT);
# a própria função confere a chave.
[functions.agente-midia]
verify_jwt = false
